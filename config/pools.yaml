version: 1
providers:
  opencode-go:
    base_url_env: OPENCODE_GO_API_BASE
    api_key_env: OPENCODE_GO_API_KEY
  sensenova:
    base_url_env: SENSENOVA_API_BASE
    api_key_env: SENSENOVA_API_KEY
  deepseek-official:
    base_url_env: DEEPSEEK_OFFICIAL_API_BASE
    api_key_env: DEEPSEEK_OFFICIAL_API_KEY
  agnes-official:
    base_url_env: AGNES_API_BASE
    api_key_env: AGNES_API_KEY

channels:
  sensenova-deepseek-v4-flash:
    id: sensenova-deepseek-v4-flash
    provider: sensenova
    externally_exposed: true
    public_model: sensenova-deepseek-v4-flash
    litellm_model: openai/deepseek-v4-flash
    context_window_tokens: 1000000
    capabilities: [chat, code, streaming, tools, json, reasoning, responses, fim]
    provider_type: openai_compatible
    supported_params: [reasoning_effort]
    limits:
      rpm: 3
      tpm: null
      local_cooldown_seconds: 300
      window_seconds: 18000
      max_requests_per_window: 500
      quota_cooldown_seconds: 3600
      busy_threshold: 3
      busy_window_minutes: 5
      busy_cooldown_seconds: 300
    retry_policy:
      max_retries: 3
      backoff: {base_seconds: 5, max_seconds: 60, exponential: true}

  opencode-go-deepseek-v4-flash:
    id: opencode-go-deepseek-v4-flash
    provider: opencode-go
    externally_exposed: true
    public_model: opencode-go-deepseek-v4-flash
    litellm_model: openai/deepseek-v4-flash
    context_window_tokens: 1000000
    capabilities: [chat, code, streaming, tools, json, reasoning, responses, fim]
    provider_type: openai_compatible
    supported_params: [reasoning_effort]
    limits:
      rpm: null
      tpm: null
      local_cooldown_seconds: 300
      window_seconds: 18000
      max_requests_per_window: null
      quota_cooldown_seconds: 18000
      busy_threshold: 3
      busy_window_minutes: 5
      busy_cooldown_seconds: 300
    retry_policy:
      max_retries: 2
      backoff: {base_seconds: 3, max_seconds: 30}

  deepseek-official-deepseek-v4-flash:
    id: deepseek-official-deepseek-v4-flash
    provider: deepseek-official
    externally_exposed: true
    public_model: deepseek-official-deepseek-v4-flash
    litellm_model: openai/deepseek-v4-flash
    context_window_tokens: 1000000
    capabilities: [chat, code, streaming, tools, json, reasoning, responses, fim]
    provider_type: openai_compatible
    supported_params: [reasoning_effort]
    limits:
      rpm: null
      tpm: null
      local_cooldown_seconds: 300
      window_seconds: 18000
      max_requests_per_window: null
      quota_cooldown_seconds: 18000
      busy_threshold: 3
      busy_window_minutes: 5
      busy_cooldown_seconds: 300
    retry_policy:
      max_retries: 1
      backoff: {base_seconds: 10, max_seconds: 120, exponential: false}

  agnes-flash:
    id: agnes-flash
    provider: agnes-official
    externally_exposed: true
    public_model: agnes-flash
    litellm_model: openai/agnes-2.5-flash
    context_window_tokens: 200000
    capabilities: [chat, streaming]
    provider_type: agnes
    supported_params: []
    limits:
      rpm: null
      tpm: null
      local_cooldown_seconds: 300
      window_seconds: 18000
      max_requests_per_window: 1500
      quota_cooldown_seconds: 3600
      busy_threshold: 3
      busy_window_minutes: 5
      busy_cooldown_seconds: 300
    retry_policy:
      max_retries: 3

  sensenova-flash-lite:
    id: sensenova-flash-lite
    provider: sensenova
    externally_exposed: true
    public_model: sensenova-flash-lite
    litellm_model: openai/sensenova-6.8-flash-lite
    context_window_tokens: 1000000
    capabilities: [chat, code, streaming, tools, json, reasoning, responses, fim]
    provider_type: openai_compatible
    supported_params: [reasoning_effort]
    limits:
      rpm: null
      tpm: null
      local_cooldown_seconds: 300
      window_seconds: 18000
      max_requests_per_window: 1500
      quota_cooldown_seconds: 3600
      busy_threshold: 3
      busy_window_minutes: 5
      busy_cooldown_seconds: 300
    retry_policy:
      max_retries: 3
      backoff: {base_seconds: 5, max_seconds: 60, exponential: true}

# Runner 是唯一对外资源；每个 Runner 可包含一个或多个内部 Channel。
# 旧版 pools/connections 配置仍可被加载器一次性迁移。
runners:
  sensenova-flash-plus:
    public_model: sensenova-flash-plus
    tiers:
      sensenova-flash-lite: 0
      sensenova-deepseek-v4-flash: 1
      agnes-flash: 1
    selection:
      strategy: cost_aware
      fallback:
        order: cost_ascending
        trigger: [quota_exhausted, busy_persistent, failure]
        max_fallback_tiers: 2
        reattach:
          probe_before_switch_back: true
          quiet_window_seconds: 1200
          quota_recover_seconds: 3600
          failure_retry_after: 300
    context_policy:
      reserve_output_tokens: 8192
    session_affinity:
      enabled: true
      idle_seconds: 3600
      minimum_messages: 2
    channels:
      - sensenova-flash-lite
      - agnes-flash
      - sensenova-deepseek-v4-flash

  mix-deepseek-v4-flash:
    public_model: mix-deepseek-v4-flash
    tiers:
      sensenova-deepseek-v4-flash: 0
      opencode-go-deepseek-v4-flash: 1
      deepseek-official-deepseek-v4-flash: 2
    selection:
      strategy: cost_aware
      fallback:
        order: cost_ascending
        trigger: [quota_exhausted, busy_persistent, failure]
        max_fallback_tiers: 2
        reattach:
          probe_before_switch_back: true
          quiet_window_seconds: 1200
          quota_recover_seconds: 3600
          failure_retry_after: 300
      stickiness:
        min_stable_seconds: 3600
    context_policy:
      reserve_output_tokens: 8192
    session_affinity:
      enabled: true
      idle_seconds: 3600
      minimum_messages: 2
    channels:
      - sensenova-deepseek-v4-flash
      - opencode-go-deepseek-v4-flash
      - deepseek-official-deepseek-v4-flash

# 兼容别名(旧版 Link)：对外稳定名称 -> Runner 或单 Channel。
# 新配置可继续保留这些外部名称，地址和 URL 不变。
links:
  # 主别名: 指向混合 Runner(默认全量流量走这里)
  main: mix-deepseek-v4-flash
  # 单通道别名: 想让某个外部系统直连 sensenova 时用
  sensenova-only: sensenova-deepseek-v4-flash
  # Hermes 后端别名: 直连 AGNES 单通道
  # Preserve the legacy alias while using the single canonical Agnes pair.
  hermes-backend: agnes-flash
