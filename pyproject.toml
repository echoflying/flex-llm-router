[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flex-llm-router"
version = "0.1.0"
description = "Policy-driven LLM channel pools backed by LiteLLM"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "litellm>=1.70",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "uvicorn[standard]>=0.30",
  "socksio>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
flex-router = "flex_llm_router.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flex_llm_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
