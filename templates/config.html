<main class="config-page">
  <div class="page-head"><div><h1>Config</h1><small>{{ config_path }}</small></div><span id="notice" class="notice" role="status"></span></div>
  <nav class="config-tabs" role="tablist" aria-label="配置资源">
    <button class="config-tab active" role="tab" aria-selected="true" data-tab="runner">Runner</button>
    <button class="config-tab" role="tab" aria-selected="false" data-tab="channel">Channel</button>
    <button class="config-tab" role="tab" aria-selected="false" data-tab="model">Model</button>
  </nav>

  <section id="tab-runner" class="tab-pane" role="tabpanel">
    <div class="section-head"><div><h2>Runner</h2><p>对外的统一资源。每个 Runner 可由一个或多个 Channel 组成，并沿用现有调度策略。</p></div></div>
    <div id="runner-list" class="card-grid"><p class="muted">加载中…</p></div>
  </section>

  <section id="tab-channel" class="tab-pane" role="tabpanel" hidden>
    <div class="section-head"><div><h2>Channel</h2><p>Channel 是一个 Provider + Model 对。关闭“对外”后仍可供 Runner 内部路由，但不会出现在 <code>/v1/models</code>。</p></div></div>
    <div class="table-wrap"><table class="editor-table"><thead><tr><th>ID</th><th>Provider</th><th>LiteLLM model</th><th>对外</th><th>启用</th><th></th></tr></thead><tbody id="channel-list"><tr><td colspan="6" class="muted">加载中…</td></tr></tbody></table></div>
  </section>

  <section id="tab-model" class="tab-pane" role="tabpanel" hidden>
    <div class="section-head"><div><h2>Model</h2><p>管理 Provider 与模型候选。这里只保存 <code>.env</code> 中的变量名，不显示或保存密钥值。</p></div></div>
    <div id="provider-list" class="card-grid"><p class="muted">加载中…</p></div>
    <form id="provider-new" class="provider-new"><h3>添加 Provider</h3><div class="form-row"><label>名称<input name="id" required placeholder="provider-name"></label><label>Base URL 环境变量<input name="base_url_env" required placeholder="PROVIDER_API_BASE"></label><label>API Key 环境变量<input name="api_key_env" required placeholder="PROVIDER_API_KEY"></label><button class="primary">保存</button></div></form>
  </section>
</main>
<!-- Kept hidden for clients/tests that relied on the old raw YAML marker. -->
<pre class="legacy-yaml" aria-hidden="true"><code>{{ raw_yaml }}</code></pre>

<style>
:root{--line:#e3e8ef;--ink:#18212f;--muted:#667085;--blue:#2764a8;--card:#fff}
.config-page{max-width:1180px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px}.page-head h1{margin:0 0 3px}.notice{font-size:12px;color:#087443;min-height:18px}.notice.error{color:#b42318}.config-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}.config-tab{border:0;background:transparent;color:var(--muted);padding:10px 20px;font:600 14px system-ui;cursor:pointer;border-bottom:3px solid transparent}.config-tab:hover{color:var(--ink);background:#f4f7fb}.config-tab.active{color:var(--blue);border-bottom-color:var(--blue)}.section-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:12px}.section-head h2{font-size:17px;margin:0 0 3px}.section-head p{font-size:12px;color:var(--muted);margin:0;line-height:1.5}.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:14px 16px}.card h3{font-size:15px;margin:0 0 10px}.card small,.muted{color:var(--muted);font-size:12px}.form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.form-row label,.field label{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:11px;flex:1;min-width:150px}.form-row input,.field input,.field select,.editor-table input,.editor-table select{border:1px solid #bdcbdb;border-radius:5px;padding:6px 8px;background:#fff;color:var(--ink);font:13px system-ui}.editor-table input,.editor-table select{width:100%;box-sizing:border-box}.primary,.save{border:1px solid #2764a8;border-radius:5px;background:#2764a8;color:#fff;padding:7px 13px;cursor:pointer;font:13px system-ui}.secondary{border:1px solid #bdcbdb;border-radius:5px;background:#fff;color:var(--ink);padding:6px 10px;cursor:pointer;font:13px system-ui}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px;background:#fff}.editor-table{width:100%;border-collapse:collapse;min-width:800px}.editor-table th,.editor-table td{padding:9px 10px;border-bottom:1px solid #edf0f4;text-align:left;vertical-align:middle}.editor-table th{background:#f7f9fc;color:var(--muted);font-size:11px;font-weight:600}.editor-table td{font-size:12px}.editor-table code{font-size:12px}.toggle{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.toggle input{accent-color:var(--blue)}.runner-channels{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px;margin:10px 0}.runner-channels label{font-size:12px;color:var(--ink);display:flex;gap:6px;align-items:center}.runner-meta{display:flex;gap:7px;align-items:center;margin-bottom:8px}.runner-meta input{flex:1}.provider-new{margin-top:16px;padding:14px 16px;border:1px dashed #bdcbdb;border-radius:9px;background:#fbfcfe}.provider-new h3{font-size:14px;margin:0 0 10px}
.legacy-yaml{display:none}
@media(max-width:720px){.card-grid{grid-template-columns:1fr}.config-tab{padding:9px 13px}.form-row{display:grid;grid-template-columns:1fr}.form-row label{min-width:0}}
</style>

<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={runners:[],channels:[],providers:[]};
function say(text,error=false){const n=$('#notice');n.textContent=text;n.className='notice'+(error?' error':'');clearTimeout(say.t);say.t=setTimeout(()=>n.textContent='',3500)}
document.querySelector('.config-tabs').addEventListener('click',e=>{const b=e.target.closest('.config-tab');if(!b)return;document.querySelectorAll('.config-tab').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-selected',x===b)});document.querySelectorAll('.tab-pane').forEach(x=>x.hidden=x.id!=='tab-'+b.dataset.tab)});
async function call(url,opts){const r=await fetch(url,opts);let d={};try{d=await r.json()}catch(_){}if(!r.ok)throw new Error(d.detail||d.error||r.status);return d}
function renderRunners(){const all=state.channels;$('#runner-list').innerHTML=state.runners.length?state.runners.map(r=>`<article class="card runner-card" data-name="${esc(r.name)}"><h3>Runner · ${esc(r.public_model||r.name)}</h3><div class="runner-meta"><label class="field" style="flex:1">对外模型名<input class="runner-model" value="${esc(r.public_model||r.name)}"></label><span class="muted">${r.channels.length} 个 Channel</span></div><div class="runner-channels">${all.map(c=>`<label><input type="checkbox" value="${esc(c.id)}" ${r.channels.some(x=>x.id===c.id)?'checked':''}> ${esc(c.id)} <small>· ${esc(c.provider)}</small></label>`).join('')}</div><button class="save runner-save">保存 Runner</button></article>`).join(''):'<p class="muted">暂无 Runner</p>';
document.querySelectorAll('.runner-save').forEach(b=>b.onclick=async()=>{const card=b.closest('.runner-card'),name=card.dataset.name;const channels=[...card.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value);if(!channels.length)return say('Runner 至少需要一个 Channel',true);try{await call('/api/config/runners/'+encodeURIComponent(name),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({public_model:card.querySelector('.runner-model').value.trim(),channels})});say('Runner 已保存');await load()}catch(e){say(e.message,true)}})}
function renderChannels(){const providers=state.providers;$('#channel-list').innerHTML=state.channels.length?state.channels.map(c=>`<tr data-id="${esc(c.id)}"><td><code>${esc(c.id)}</code></td><td><select class="ch-provider">${providers.map(p=>`<option value="${esc(p.id)}" ${p.id===c.provider?'selected':''}>${esc(p.id)}</option>`).join('')}</select></td><td><input class="ch-model" value="${esc(c.litellm_model)}"></td><td><label class="toggle"><input class="ch-exposed" type="checkbox" ${c.externally_exposed?'checked':''}> 是</label></td><td><label class="toggle"><input class="ch-enabled" type="checkbox" ${c.enabled?'checked':''}> 是</label></td><td><button class="secondary ch-save">保存</button></td></tr>`).join(''):'<tr><td colspan="6" class="muted">暂无 Channel</td></tr>';
document.querySelectorAll('.ch-save').forEach(b=>b.onclick=async()=>{const row=b.closest('tr');try{await call('/api/config/channels/'+encodeURIComponent(row.dataset.id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:row.querySelector('.ch-provider').value,litellm_model:row.querySelector('.ch-model').value.trim(),externally_exposed:row.querySelector('.ch-exposed').checked,enabled:row.querySelector('.ch-enabled').checked})});say('Channel 已保存');await load()}catch(e){say(e.message,true)}})}
function renderProviders(){$('#provider-list').innerHTML=state.providers.length?state.providers.map(p=>`<article class="card provider-card" data-name="${esc(p.id)}"><h3>${esc(p.id)} <small>${p.model_count||0} 个模型</small></h3><div class="form-row"><label>Base URL 环境变量<input class="p-base" value="${esc(p.base_url_env)}"></label><label>API Key 环境变量<input class="p-key" value="${esc(p.api_key_env)}"></label><button class="save p-save">保存</button></div><p class="muted">仅保存变量名；实际值留在本机 .env。</p></article>`).join(''):'<p class="muted">暂无 Provider</p>';
document.querySelectorAll('.p-save').forEach(b=>b.onclick=async()=>{const card=b.closest('.provider-card');try{await call('/api/config/providers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:card.dataset.name,base_url_env:card.querySelector('.p-base').value.trim(),api_key_env:card.querySelector('.p-key').value.trim()})});say('Provider 已保存');await load()}catch(e){say(e.message,true)}})}
$('#provider-new').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await call('/api/config/providers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});e.target.reset();say('Provider 已添加');await load()}catch(err){say(err.message,true)}};
async function load(){try{const v=await call('/api/config/editor');state={runners:v.runners||[],channels:v.channels||[],providers:v.providers||[]};renderRunners();renderChannels();renderProviders()}catch(e){say('配置加载失败：'+e.message,true)}}load();
</script>
