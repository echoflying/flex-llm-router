<style>
.setup{max-width:1080px}.setup h1{margin:8px 0 3px}.sub{color:#697587}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}
.legend{font-size:12px;color:#516174;display:flex;gap:14px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.hot{background:#087443}.dot.reboot{background:#b54708}
.action{border:1px solid #bdcbdb;border-radius:6px;background:#fff;color:#1c3550;padding:6px 11px;font:inherit;cursor:pointer}
.action:hover{background:#f4f7fb}.action.danger{border-color:#cc8580;color:#9f2929}.action.danger:hover{background:#fff4f3}
.muted{font-size:11px;color:#718094}
.tree{display:flex;flex-direction:column;gap:10px}
.cat{background:#fff;border:1px solid #e3e8ef;border-radius:9px;overflow:hidden}
.cat summary{cursor:pointer;list-style:none;padding:12px 15px;display:flex;align-items:center;gap:10px;user-select:none}
.cat summary::-webkit-details-marker{display:none}
.chevron{transition:transform .12s;flex:0 0 auto;color:#8592a3}
.cat[open] .chevron{transform:rotate(90deg)}
.cat-head{flex:1}.cat-head b{font-size:14px}.cat-head .desc{font-size:11px;color:#718094;margin-top:2px}
.cat-count{font-size:11px;color:#8592a3;background:#f2f5f9;border:1px solid #e3e8ef;border-radius:20px;padding:1px 9px}
.item{border-top:1px solid #edf0f4}
.item-row{display:flex;align-items:flex-start;gap:10px;padding:10px 15px}
.item-row:hover{background:#fafcff}
.item-main{flex:1;min-width:0}
.item-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item-name{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;font-weight:600;color:#1c3550}
.badge{font-size:11px;border-radius:5px;padding:1px 7px;border:1px solid}
.badge.hot{color:#087443;border-color:#a6d7c0;background:#f0faf4}
.badge.reboot{color:#b54708;border-color:#e6b98f;background:#fdf6ef}
.item-desc{font-size:12px;color:#586779;line-height:1.55;margin-top:6px}
.pencil{flex:0 0 auto;border:1px solid #cdd7e3;background:#fff;border-radius:6px;width:28px;height:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#1c3550}
.pencil:hover{background:#eef3f9;border-color:#9fb0c4}
.pencil svg{width:15px;height:15px}
.editor{display:none;padding:10px 15px 14px;border-top:1px dashed #e3e8ef;background:#fafcfd}
.editor.open{display:block}
.editor-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.editor label{font-size:12px;color:#516174}
.editor input[type=number]{width:110px;padding:6px 8px;border:1px solid #bdcbdb;border-radius:6px;font:inherit;-webkit-appearance:none;-moz-appearance:textfield}
.editor input[type=number]::-webkit-inner-spin-button,.editor input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
.toggle{display:inline-flex;border:1px solid #bdcbdb;border-radius:6px;overflow:hidden}
.toggle button{border:0;background:#fff;padding:6px 14px;cursor:pointer;font:inherit;color:#516174;transition:.1s}
.toggle button.sel-on{background:#087443;color:#fff}
.toggle button.sel-off{background:#b42318;color:#fff}
.save-status{font-size:12px;margin-left:6px}.ok{color:#087443}.bad{color:#b42318}
.eff{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#1c3550;background:#f2f5f9;border:1px solid #e3e8ef;border-radius:5px;padding:1px 7px}
.source{font-size:11px;color:#8592a3}.source b{color:#516174}
.toast{position:fixed;bottom:18px;right:18px;max-width:340px;background:#1f2a37;color:#fff;border-radius:8px;padding:11px 14px;font-size:12.5px;line-height:1.5;box-shadow:0 6px 22px rgba(0,0,0,.22);opacity:0;transform:translateY(8px);transition:.18s;z-index:50}
.toast.show{opacity:1;transform:none}
.toast.ok{border-left:3px solid #4ade80}.toast.err{border-left:3px solid #f87171}
</style>
<main class="setup">
<h1>Setup · 配置中心</h1>
<p class="sub">分类目录 · 点击项上的铅笔修改对应配置 · 每项下方有详细作用说明</p>
<div class="topbar">
  <div class="legend">
    <span><i class="dot hot"></i>热生效（保存立即生效，无需重启）</span>
    <span><i class="dot reboot"></i>重启核心 Router(:7800) 后生效</span>
    <span class="muted">保存后自动写入 config/setup.conf</span>
  </div>
  <button class="action danger" id="restart-core">重启核心 Router</button>
</div>
<div class="tree" id="tree">加载中…</div>
</main>
<script>
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pencilSVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>';
function toast(msg,ok){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.className='toast '+(ok?'ok':'err')+' show';clearTimeout(t._h);t._h=setTimeout(()=>t.className='toast',2600)}
function paintToggle(tg,on){if(!tg)return;tg.dataset.sel=on?'1':'0';tg.querySelector('.sel-on').classList.toggle('sel-on',!!on);tg.querySelector('.sel-off').classList.toggle('sel-off',!on)}

function render(data){
  document.getElementById('tree').innerHTML=data.categories.map(cat=>{
    const rows=cat.items.map(it=>{
      const effText=esc(it.value)+(it.unit?' '+esc(it.unit):'');
      let ctrl;
      if(it.type==='bool'){
        ctrl='<div class="toggle" data-sel="'+it.value+'"><button class="sel-on" data-v="1">开</button><button class="sel-off" data-v="0">关</button></div>';
      }else{
        ctrl='<label>值 <input type="number" min="'+it.min+'" max="'+it.max+'" value="'+esc(it.value)+'"></label><span class="muted unit">'+(it.unit?esc(it.unit):'')+'</span>';
      }
      const range=it.type==='int'
        ?'<div class="muted">范围 '+esc(it.min)+' ~ '+esc(it.max)+' · 默认 '+esc(it.default)+(it.unit?' '+esc(it.unit):'')+'</div>'
        :'<div class="muted">开 / 关（写入 1 / 0）</div>';
      return '<div class="item" data-key="'+it.key+'">'
        +'<div class="item-row"><div class="item-main">'
        +'<div class="item-top"><span class="item-name">'+esc(it.key)+'</span>'
        +'<span class="badge '+(it.hot?'hot':'reboot')+'">'+(it.hot?'热生效':'重启生效')+'</span>'
        +'<span class="eff" data-unit="'+esc(it.unit||'')+'">'+effText+'</span>'
        +'<span class="source">来源 <b>'+esc(it.source)+'</b></span></div>'
        +'<div class="item-desc">'+esc(it.desc)+'</div></div>'
        +'<button class="pencil" title="修改">'+pencilSVG+'</button></div>'
        +'<div class="editor"><div class="editor-row">'+ctrl
        +'<button class="action save">保存</button><button class="action cancel">取消</button>'
        +'<span class="save-status"></span></div>'+range+'</div></div>';
    }).join('');
    return '<details class="cat" open><summary><span class="chevron">▸</span>'
      +'<span class="cat-head"><b>'+esc(cat.label)+'</b><div class="desc">'+esc(cat.desc)+'</div></span>'
      +'<span class="cat-count">'+cat.items.length+' 项</span></summary>'+rows+'</details>';
  }).join('');
  // 初始化开/关高亮（当前为开 或 关）
  data.categories.forEach(cat=>cat.items.forEach(it=>{
    if(it.type==='bool'){
      const tg=document.querySelector(".item[data-key='"+it.key+"'] .toggle");
      paintToggle(tg,it.value==='1');
    }
  }));
  // 只读：通道 API 密钥来源
  const ch=document.createElement('details');ch.className='cat';ch.setAttribute('open','');
  ch.innerHTML='<summary><span class="chevron">▸</span><span class="cat-head"><b>通道 API 密钥（来源）</b>'
    +'<div class="desc">各 Channel 的 API Base / API Key 环境变量当前生效来源（存于 .env，不在此页修改）</div></span>'
    +'<span class="cat-count">'+data.channels.length+' 项</span></summary>'
    +data.channels.map(c=>'<div class="item"><div class="item-row"><div class="item-main"><div class="item-top">'
      +'<span class="item-name">'+esc(c.key)+'</span>'
      +'<span class="badge '+(c.source==='缺失'?'reboot':'hot')+'">'+(c.source==='缺失'?'缺失':'已配置')+'</span>'
      +'<span class="source">来源 <b>'+esc(c.source)+'</b></span>'
      +'</div></div></div></div>').join('');
  document.getElementById('tree').appendChild(ch);
}

document.getElementById('tree').addEventListener('click',(ev)=>{
  const itemEl=ev.target.closest('.item');if(!itemEl)return;
  const toggleBtn=ev.target.closest('.toggle button');
  if(toggleBtn){const tg=toggleBtn.closest('.toggle');paintToggle(tg,toggleBtn.dataset.v==='1');return;}
  if(ev.target.closest('.cancel')){itemEl.querySelector('.editor').classList.remove('open');return;}
  if(ev.target.closest('.pencil')){itemEl.querySelector('.editor').classList.toggle('open');return;}
  if(ev.target.closest('.save')){save(itemEl);return;}
});

async function save(itemEl){
  const key=itemEl.dataset.key;const editor=itemEl.querySelector('.editor');
  const saveBtn=editor.querySelector('.save');const status=editor.querySelector('.save-status');
  const tg=editor.querySelector('.toggle');const num=editor.querySelector('input[type=number]');
  const value=tg?tg.dataset.sel:num.value;
  saveBtn.disabled=true;status.className='save-status';status.textContent='保存中…';
  try{
    const r=await fetch('/api/config/item/'+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({value:value})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.detail||'保存失败');
    status.className='save-status ok';status.textContent=d.note||'已保存';
    const eff=itemEl.querySelector('.eff');
    eff.textContent=d.value+(eff.dataset.unit?' '+eff.dataset.unit:'');
    const src=itemEl.querySelector('.source');src.innerHTML='来源 <b>'+esc(d.source)+'</b>';
    const badge=itemEl.querySelector('.badge');badge.textContent=d.hot?'热生效':'重启生效';badge.className='badge '+(d.hot?'hot':'reboot');
    editor.classList.remove('open');
    toast('已保存'+(d.hot?'并热生效':'（重启后生效）'),true);
  }catch(e){status.className='save-status bad';status.textContent='保存失败：'+(e.message||e);toast('保存失败：'+(e.message||e),false);}
  finally{saveBtn.disabled=false;}
}

document.getElementById('restart-core').onclick=async()=>{if(!confirm('重启核心 Router 会中断所有正在进行的模型调用。确定继续吗？'))return;const b=document.getElementById('restart-core');b.disabled=true;b.textContent='正在重启…';try{await fetch('/api/admin/restart',{method:'POST'});toast('重启指令已发送…',true)}catch(e){toast('发送失败：'+(e.message||e),false)}setTimeout(()=>location.reload(),2500)};
(function(){const t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)})();
fetch('/api/config').then(r=>r.json().catch(()=>null).then(d=>{
  if(!r.ok||!d||!Array.isArray(d.categories)){
    const why=(d&&d.detail)?(': '+d.detail):'';
    throw new Error('后端 '+(r.status||'异常')+why+'（核心 Router 可能未加载新代码，请重启核心 :7800）');
  }
  render(d);
})).catch(e=>{document.getElementById('tree').textContent='加载配置失败：'+e.message;});
</script>
