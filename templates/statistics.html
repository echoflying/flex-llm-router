<style>
.head{display:flex;justify-content:space-between;align-items:end;margin:10px 0 22px}.head h1{margin:0;font-size:26px}.head p,.note{color:#697587}.tabs{background:#e9eef6;border-radius:9px;padding:3px}.tabs button{border:0;border-radius:6px;background:transparent;padding:7px 14px;cursor:pointer}.tabs button.active{background:#fff;color:#1d4e89;box-shadow:0 1px 3px #9aa7b633}.tabs+.tabs{margin-left:8px}.cards{display:grid;grid-template-columns:repeat(4,minmax(150px,220px));justify-content:start;gap:12px;margin-bottom:18px}.card,.panel{background:#fff;border:1px solid #e4e9f1;border-radius:11px}.card{padding:14px 16px}.label{color:#697587;font-size:13px;font-weight:600}.value{font-size:28px;font-weight:700;margin-top:7px}.value .rate,.inline-rate{font-size:.52em;font-weight:650;color:#758193;white-space:nowrap}.bad .value{color:#c23b3b}.bad .value .rate{color:#b97979}.note{font-size:12px;margin-top:4px}.panel{overflow:hidden}.duplicate-panel{margin:22px 0 18px}.duplicate-total{color:#8c6b24;background:#fff8e5;border:1px solid #ebd8a6;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700}.chart{margin-bottom:18px;padding:18px}.chart h2,.paneltop h2{font-size:15px;margin:0}.legend{font-size:12px;color:#697587;margin:8px 0}.legend b{margin-right:14px}.calls{color:#2764a8}.success,.first{color:#5f927c}.retry{color:#bd9258}.fail{color:#b97979}.grid{stroke:#e8edf4}.tick{stroke:#b8c2d0}.axis{fill:#697587;font-size:10px}.line-calls{fill:none;stroke:#2764a8;stroke-width:2}.line-success{fill:none;stroke:#5f927c;stroke-width:2}.line-fail{fill:none;stroke:#b97979;stroke-width:2;stroke-dasharray:4 3}.bar-first{fill:#7eae98}.bar-retry{fill:#d4af78}.bar-fail{fill:#c99595}.charttop{display:flex;justify-content:space-between;align-items:center}.charttop label{font-size:12px;margin-left:10px}.paneltop{padding:16px 18px;border-bottom:1px solid #edf0f4;display:flex;justify-content:space-between}table{width:100%;border-collapse:collapse}th{background:#fbfcfe;color:#697587;font-size:11px;text-align:left;padding:11px 18px}td{padding:13px 18px;border-top:1px solid #f0f2f5}.name{font:600 13px ui-monospace,monospace}.empty{text-align:center;padding:34px;color:#7a8798}@media(max-width:720px){.head{align-items:start;flex-direction:column}.cards{grid-template-columns:repeat(2,minmax(140px,1fr))}}
</style>
<section class="head"><div><h1>调用统计</h1><p>请求按 Pool / Channel 汇总；“跨 Channel 模式”指同一 Trace 实际尝试过两个或更多 Channel。</p></div><div><span class="tabs"><button data-p="day" class="active">今天</button><button data-p="week">近 7 天</button><button data-p="month">近 30 天</button></span><span class="tabs"><button data-g="channel" class="active">按 Channel</button><button data-g="pool">按 Pool</button></span></div></section>
<section id="summary" class="cards"><div class="card">加载中…</div></section>
<section id="hourly" class="panel chart"><div class="charttop"><h2 id="chart-title">今天按小时调用趋势</h2><span><label><input type="radio" name="chart-mode" value="line" checked> 数量折线图</label><label><input type="radio" name="chart-mode" value="ratio"> 结果占比图</label></span></div><div id="legend" class="legend"><b class="calls">● 调用</b><b class="success">● 成功</b><b class="fail">╌ 失败</b></div><svg id="chart" viewBox="0 0 760 230" role="img" aria-label="今天每小时调用趋势"></svg></section>
<section class="panel"><div class="paneltop"><h2 id="table-title">按 Channel</h2><small>跨 Channel 成功 / 失败均指该模式最终的结果</small></div><table><thead><tr><th>名称</th><th>总请求</th><th>一次成功</th><th>重试后成功</th><th>真正失败</th><th>跨 Channel 模式</th><th>模式成功</th><th>模式失败</th></tr></thead><tbody id="rows"></tbody></table></section>
<section class="panel duplicate-panel"><div class="paneltop"><div><h2>重复在途请求观察</h2><small>仅在 Setup 开启观察器后开始积累；只记录，不影响调用。</small></div><span id="duplicate-total" class="duplicate-total">—</span></div><table><thead><tr><th>模型</th><th>客户端</th><th>候选重复数</th><th>平均重叠时间</th><th>旧请求已输出</th></tr></thead><tbody id="duplicate-rows"></tbody></table></section>
<script>
let period='day',group='channel';const n=x=>Number(x||0),rate=(a,b)=>b?(a/b*100).toFixed(1)+'%':'0.0%',ms=x=>x==null?'—':Math.round(x)+' ms';
async function load(){const [d,dup]=await Promise.all([fetch('/api/statistics/requests?period='+period+'&group_by='+group).then(r=>r.json()),fetch('/api/statistics/duplicates?period='+period).then(r=>r.ok?r.json():({count:0,rows:[]}))]),all=n(d.total),first=n(d.first_success),retry=n(d.retry_success),bad=n(d.failed),cross=n(d.cross_total),crossOK=n(d.cross_success),crossBad=n(d.cross_failed),withRate=(count,total)=>`${n(count)} <span class="rate">（${rate(n(count),n(total))}）</span>`;summary.innerHTML=`<div class="card"><div class="label">总请求</div><div class="value">${all}</div><div class="note">${period==='day'?'今天本地零点至现在':'所选时间范围内'}</div></div><div class="card"><div class="label">一次成功</div><div class="value">${first}</div><div class="note">一次成功率 ${rate(first,all)}</div></div><div class="card"><div class="label">重试后成功</div><div class="value">${withRate(retry,all)}</div><div class="note">经历至少一次重试或退让</div></div><div class="card bad"><div class="label">真正失败</div><div class="value">${withRate(bad,all)}</div><div class="note">最终未成功的请求</div></div><div class="card"><div class="label">跨 Channel 模式</div><div class="value">${cross}</div><div class="note">成功 ${crossOK} · 失败 ${crossBad}</div></div>`;document.querySelector('#table-title').textContent=group==='channel'?'按首个 Channel':'按 Pool';rows.innerHTML=d.rows.map(r=>`<tr><td class="name">${r.name}</td><td>${n(r.total)}</td><td>${withRate(r.first_success,r.total)}</td><td>${withRate(r.retry_success,r.total)}</td><td>${withRate(r.failed,r.total)}</td><td>${n(r.cross_total)}</td><td>${n(r.cross_success)}</td><td>${n(r.cross_failed)}</td></tr>`).join('')||'<tr><td class="empty" colspan="8">暂无调用记录</td></tr>';document.querySelector('#duplicate-total').textContent=n(dup.count)+' 条';document.querySelector('#duplicate-rows').innerHTML=(dup.rows||[]).map(r=>`<tr><td class="name">${r.requested_model}</td><td>${r.client_label||'—'}</td><td>${n(r.count)}</td><td>${r.avg_overlap_ms==null?'—':(n(r.avg_overlap_ms)/1000).toFixed(1)+' 秒'}</td><td>${n(r.with_output)}</td></tr>`).join('')||'<tr><td class="empty" colspan="5">尚未有观察记录</td></tr>'}
async function draw(){const a=(await fetch('/api/statistics/calls/hourly').then(r=>r.json())).data,max=Math.max(1,...a.flatMap(x=>[x.calls,x.success,x.failed])),x=i=>52+i*29.2,y=v=>190-v/max*150,p=k=>a.map((z,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(z[k]).toFixed(1)).join(' '),ticks=a.map((_,i)=>`<line class="tick" x1="${x(i)}" y1="190" x2="${x(i)}" y2="195"/>`).join('');chart.innerHTML=`<line class="grid" x1="52" y1="190" x2="730" y2="190"/><line class="grid" x1="52" y1="115" x2="730" y2="115"/><line class="grid" x1="52" y1="40" x2="730" y2="40"/><text class="axis" x="24" y="193">0</text><text class="axis" x="20" y="118">${Math.ceil(max/2)}</text><text class="axis" x="20" y="43">${max}</text>${ticks}${[0,4,8,12,16,20,23].map(i=>`<text class="axis" x="${x(i)-8}" y="212">${a[i].hour}</text>`).join('')}<path class="line-calls" d="${p('calls')}"/><path class="line-success" d="${p('success')}"/><path class="line-fail" d="${p('failed')}"/>`}
async function ratio(){const a=(await fetch('/api/statistics/requests/hourly').then(r=>r.json())).data,x=i=>52+i*29.2,w=20,base=190,h=150,bar=(z,i,k,offset,cls)=>z.total?`<rect class="${cls}" x="${x(i)-w/2}" y="${base-h*(offset+z[k]/z.total)}" width="${w}" height="${h*z[k]/z.total}"/>`:'',ticks=a.map((_,i)=>`<line class="tick" x1="${x(i)}" y1="190" x2="${x(i)}" y2="195"/>`).join('');chart.innerHTML=`<line class="grid" x1="52" y1="190" x2="730" y2="190"/><line class="grid" x1="52" y1="40" x2="730" y2="40"/><text class="axis" x="12" y="193">0%</text><text class="axis" x="6" y="43">100%</text>${ticks}${a.map((z,i)=>bar(z,i,'first_success',0,'bar-first')+bar(z,i,'retry_success',z.first_success/z.total||0,'bar-retry')+bar(z,i,'failed',(z.first_success+z.retry_success)/z.total||0,'bar-fail')).join('')}${[0,4,8,12,16,20,23].map(i=>`<text class="axis" x="${x(i)-8}" y="212">${a[i].hour}</text>`).join('')}`}
document.querySelectorAll('button[data-p]').forEach(b=>b.onclick=()=>{period=b.dataset.p;document.querySelectorAll('button[data-p]').forEach(x=>x.classList.toggle('active',x===b));hourly.style.display=period==='day'?'block':'none';load()});document.querySelectorAll('button[data-g]').forEach(b=>b.onclick=()=>{group=b.dataset.g;document.querySelectorAll('button[data-g]').forEach(x=>x.classList.toggle('active',x===b));load()});document.querySelectorAll('input[name="chart-mode"]').forEach(r=>r.onchange=()=>{const ratioMode=r.value==='ratio'&&r.checked;document.querySelector('#chart-title').textContent=ratioMode?'今天按小时请求结果占比':'今天按小时调用趋势';legend.innerHTML=ratioMode?'<b class="first">● 一次成功</b><b class="retry">● 重试后成功</b><b class="fail">● 真正失败</b>':'<b class="calls">● 调用</b><b class="success">● 成功</b><b class="fail">╌ 失败</b>';ratioMode?ratio():draw()});load();draw();
</script>
