<h1>调用轨迹</h1>
<small>每轮 HTTP 调用独立追踪；429、等待、重试和退让均归入原 Trace · 自动刷新 2 秒</small>
<div class="pulse"><span id="pulse-start">—</span><div id="pulse-lights" class="pulse-lights" aria-label="最近 40 次调用结果"></div><span id="pulse-now">—</span></div>
<fieldset class="filter"><legend>筛选</legend><label><input name="trace-filter" type="radio" value="all" checked> 全部</label><label><input name="trace-filter" type="radio" value="retry"> 只看重试/退让</label><label><input name="trace-filter" type="radio" value="failed"> 只看失败</label></fieldset>
<div class="layout"><section class="trace-list"><h2>进行中 <span id="running-count"></span></h2><div id="running"></div><h2>已完成</h2><div id="done"></div></section><section class="detail"><h2 id="title">选择一条调用轨迹</h2><div id="summary"></div><ol id="events"></ol><h3>真实上游调用</h3><div id="attempts"></div><section id="full-request" class="full-request" hidden><div class="full-request-head"><h3 id="full-request-title">完整请求</h3><button id="copy-full-request" type="button">copy</button></div><pre id="full-request-body"></pre></section></section></div>
<style>
.pulse{display:flex;align-items:center;gap:0;margin:13px 0 3px;color:#697587;font-size:12px}.pulse-lights{display:contents}.pulse-light{width:8px;height:12px;margin-right:2px;border:0;border-radius:2px;background:#e2e7ed;padding:0;cursor:default}.pulse-light.has-trace{cursor:pointer}.pulse-light.has-trace:hover{outline:2px solid #8aa5c2;outline-offset:1px}.pulse-light:last-child{margin-right:7px}.pulse-light.first{background:#76aa86}.pulse-light.retry{background:#d5ae58}.pulse-light.cross{background:#d88943}.pulse-light.failed{background:#c98282}#pulse-start{margin-right:9px}.filter{border:0;padding:0;margin:12px 0 0;font-size:13px}.filter legend{display:inline;margin-right:10px}.filter label{margin-right:14px;cursor:pointer}.layout{display:grid;grid-template-columns:minmax(360px,42%) 1fr;gap:20px;margin-top:16px;align-items:start}.layout section{min-width:0}.trace-list,.detail{height:calc(100vh - 220px);min-height:440px;overflow-y:auto;scrollbar-gutter:stable}.trace-list{padding-right:8px}.trace-list h2:first-child,.detail h2:first-child{margin-top:0}.detail{position:sticky;top:16px;background:#fff;border:1px solid #e3e8ef;border-radius:8px;padding:14px;box-sizing:border-box}.card{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e3e8ef;border-radius:7px;padding:9px;margin:6px 0;cursor:pointer;font:inherit}.card:hover,.card.selected{border-color:#2764a8;background:#f3f7fc}.card.running{border-left:4px solid #667}.card.success{border-left:4px solid #067647}.cross-success{border-left-color:#d88943}.card.failed,.card.cancelled{border-left:4px solid #b42318}.status{font-weight:700}.status.first{color:#4c815b}.status.retry{color:#9a751d}.status.cross{color:#ae6326}.status.failed,.status.cancelled{color:#a64040}.meta{color:#667;font-size:12px;margin-top:4px}.attempt-state{margin-top:7px;padding:6px 8px;border-radius:5px;background:#fff8e8;color:#7a5511;font-size:12px;line-height:1.55}.attempt-state div+div{border-top:1px solid #f0dfb6;margin-top:3px;padding-top:3px}.preview{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}.more{color:#2764a8;font-weight:650;cursor:pointer;text-decoration:underline;white-space:nowrap}.more:hover{color:#174b83}ol{padding-left:25px}li{padding:6px 0;border-bottom:1px solid #eef1f5}.event{font-weight:600}.time{color:#667;font-size:12px;margin-left:8px}.err{color:#b42318;white-space:pre-wrap;word-break:break-word}.attempt{border:1px solid #e3e8ef;border-radius:6px;padding:8px;margin:6px 0;font-size:12px}.attempt.failure{border-color:#f1b6b0;background:#fff7f6}.full-request{margin-top:18px;border-top:1px solid #e3e8ef;padding-top:10px}.full-request pre{max-height:520px;overflow:auto;background:#111827;color:#e5e7eb;padding:12px;border-radius:7px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:900px){.layout{grid-template-columns:1fr}.trace-list,.detail{height:auto;max-height:none;overflow:visible}.detail{position:static}.trace-list{padding-right:0}}
</style>
<style>.waiting{color:#667;font-size:12px;font-weight:400}.status.running{color:inherit}.card.running{border-left-color:#067647}.more{color:#667;font-size:11px;font-weight:500}.more:hover{color:#174b83}.full-request-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.full-request-head h3{margin:0}.full-request-head button{font:11px inherit;color:#667;background:#fff;border:1px solid #d5dce5;border-radius:4px;padding:2px 7px;cursor:pointer}.full-request-head button:disabled{opacity:.45;cursor:default}</style>
<script>
const q=s=>document.querySelector(s),when=x=>x?new Date(x*1000).toLocaleString():'—',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let chosen='',chosenUntil=0;
function traceTone(t){if(t.status==='running')return 'running';if(t.status!=='success')return t.status==='cancelled'?'cancelled':'failed';if((t.channel_count||0)>1)return 'cross';return t.attempt_count>1||t.fallback_count>0?'retry':'first'}
function card(t,attempts=[]){const tone=traceTone(t),final=t.final_channel?` · ${t.final_channel}`:'',waiting=t.status==='running'?` <span class="waiting">· 已等待 ${ago(t.started)}</span>`:'';const active=attempts.filter(a=>a.outcome==='started');const attemptState=t.status==='running'&&attempts.length>1?`<div class="attempt-state"><b>上游尝试：${attempts.length} 次${active.length>1?' · '+active.length+' 次并行等待中':''}</b>${attempts.map((a,i)=>{const label=i===0?'原请求':`重试 / Hedge #${i}`;const state=a.outcome==='started'?'等待上游首活动':a.outcome==='success'?'已成功':a.outcome==='cancelled'?'已取消':`失败${a.error_type?' · '+esc(a.error_type):''}`;return `<div>${label}：${state}${a.outcome==='started'?` · 已等待 ${ago(a.started)}`:''}</div>`}).join('')}</div>`:'';const label=t.status==='running'?'进行中':t.status==='success'?(tone==='cross'?'跨 Channel 成功':'成功'):t.status==='cancelled'?'已取消':'失败';return `<button class="card ${t.status} ${tone==='cross'?'cross-success':''} ${chosen===t.trace_id?'selected':''}" data-id="${t.trace_id}"><span class="status ${tone}">${label}</span> · ${when(t.updated)}${waiting}${final}<div class="preview">${esc(t.input_preview)} <span class="more" data-trace-id="${t.trace_id}" role="button" tabindex="0">more</span></div><div class="meta">客户端：${esc(t.client_label||'—')} · ${esc(t.context_summary)} · 实际调用 ${t.attempt_count} 次${t.fallback_count?' · 退让 '+t.fallback_count+' 次':''}${t.ttft_ms!=null?' · TTFT '+t.ttft_ms+'ms':''}${t.latency_ms!=null?' · '+t.latency_ms+'ms':''}</div>${attemptState}</button>`}
async function detail(id){const d=await fetch('/api/traces/'+encodeURIComponent(id)).then(r=>r.json());if(!d.trace)return;const t=d.trace;q('#title').textContent='Trace '+t.trace_id;q('#summary').innerHTML=`<div class="meta">客户端：${esc(t.client_label||'—')} · 模型：${esc(t.requested_model)} · 池：${esc(t.pool)} · ${esc(t.context_summary)}</div><p><b>本轮输入：</b>${esc(t.input_preview)}</p>${t.output_preview?`<p><b>最终返回（前 512 字）：</b>${esc(t.output_preview)}</p>`:''}${t.error_detail?`<p class="err"><b>最终错误：</b>${esc(t.error_detail)}</p>`:''}`;q('#events').innerHTML=d.events.map(e=>`<li><span class="event">${esc(e.event)}</span><span class="time">${when(e.ts)}</span>${e.channel?` · ${esc(e.channel)}`:''}${e.http_status?` · HTTP ${e.http_status}`:''}${e.detail?`<div class="meta">${esc(e.detail)}</div>`:''}</li>`).join('');q('#attempts').innerHTML=d.attempts.map(a=>`<div class="attempt ${a.outcome==='success'?'':'failure'}"><b>${esc(a.channel)}</b> · ${esc(a.outcome)}${a.error_type?` · ${esc(a.error_type)}`:''}${a.error_code?` · HTTP ${a.error_code}`:''}<div class="meta">TTFT ${a.ttft_ms??'—'}ms · 总耗时 ${a.latency_ms??'—'}ms · tokens ${a.total_tokens??'—'}</div>${a.error_detail?`<div class="err">${esc(a.error_detail)}</div>`:''}</div>`).join('')||'—';}
async function showFullRequest(id){const box=q('#full-request'),body=q('#full-request-body');box.hidden=false;body.textContent='正在读取全文…';q('#copy-full-request').disabled=true;try{const r=await fetch('/api/traces/'+encodeURIComponent(id)+'/full-request'),d=await r.json();if(!r.ok)throw new Error(d.detail||'无法读取全文');q('#full-request-title').textContent=`完整请求 · ${id} · ${Math.ceil((d.size_bytes||0)/1024)} KB`;body.textContent=JSON.stringify(d.payload,null,2);q('#copy-full-request').disabled=false}catch(e){q('#full-request-title').textContent='完整请求不可用';body.textContent=e.message||String(e)}}
const traceFilter=()=>document.querySelector('input[name="trace-filter"]:checked').value,matchTrace=(x,f)=>f==='all'||(f==='retry'&&(x.attempt_count>1||x.fallback_count>0))||(f==='failed'&&(x.status==='failed'||x.status==='cancelled'));
function ago(ts){const seconds=Math.max(0,Math.floor(Date.now()/1000-ts)),m=Math.floor(seconds/60),s=seconds%60;return `${String(m).padStart(2,'0')}分${String(s).padStart(2,'0')}秒前`}
function pulse(all){const recent=all.filter(x=>x.status!=='running').slice(0,40).reverse(),lights=q('#pulse-lights');q('#pulse-start').textContent=recent.length?new Date(recent[0].updated*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'—';q('#pulse-now').textContent=recent.length?ago(recent[recent.length-1].updated):'—';lights.innerHTML=Array.from({length:40},(_,i)=>{const t=recent[i];if(!t)return '<i class="pulse-light"></i>';const cls=traceTone(t),label=cls==='first'?'一次成功':cls==='retry'?'重试后成功':cls==='cross'?'跨 Channel 成功':'失败';return `<button class="pulse-light has-trace ${cls}" data-trace-id="${t.trace_id}" title="${new Date(t.updated*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} · ${label}"></button>`}).join('');document.querySelectorAll('.pulse-light.has-trace').forEach(b=>b.onclick=()=>chooseTrace(b.dataset.traceId,true))}
function chooseTrace(id,showAll=false){if(showAll){const all=document.querySelector('input[name="trace-filter"][value="all"]');all.checked=true}chosen=id;chosenUntil=Date.now()+180000;load().then(()=>document.querySelector(`.card[data-id="${id}"]`)?.scrollIntoView({block:'center',behavior:'smooth'}))}
async function load(){const d=await fetch('/api/traces?limit=100').then(r=>r.json()),filter=traceFilter(),matching=d.data.filter(x=>matchTrace(x,filter)),running=matching.filter(x=>x.status==='running'),done=matching.filter(x=>x.status!=='running'),exists=d.data.some(x=>x.trace_id===chosen);if(!chosen||Date.now()>=chosenUntil||!exists){chosen=d.data[0]?.trace_id||'';chosenUntil=0}pulse(d.data);q('#running-count').textContent='('+running.length+')';const runningDetails=await Promise.all(running.map(async t=>{try{return [t,(await fetch('/api/traces/'+encodeURIComponent(t.trace_id)).then(r=>r.json())).attempts||[]]}catch(_){return [t,[]]}}));q('#running').innerHTML=runningDetails.map(([t,attempts])=>card(t,attempts)).join('')||'<small>— 暂无匹配的进行中调用 —</small>';q('#done').innerHTML=done.map(t=>card(t)).join('')||`<small>— 暂无${filter==='retry'?'重试/退让':filter==='failed'?'失败':'已完成'}调用 —</small>`;document.querySelectorAll('.card').forEach(b=>b.onclick=()=>chooseTrace(b.dataset.id));document.querySelectorAll('.more').forEach(x=>{const open=ev=>{ev.preventDefault();ev.stopPropagation();showFullRequest(x.dataset.traceId)};x.onclick=open;x.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){open(ev)}}});if(chosen)detail(chosen)}q('#copy-full-request').onclick=async()=>{const button=q('#copy-full-request'),body=q('#full-request-body');try{await navigator.clipboard.writeText(body.textContent||'');button.textContent='copied';setTimeout(()=>button.textContent='copy',1200)}catch(_){button.textContent='failed';setTimeout(()=>button.textContent='copy',1200)}};document.querySelectorAll('input[name="trace-filter"]').forEach(x=>x.onchange=load);load();setInterval(load,2000);
</script>
